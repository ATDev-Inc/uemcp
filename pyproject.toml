[project]
name = "uemcp"
version = "0.1.0"
description = "Open source MCP server that lets Claude drive Unreal Engine 5 with no plugin to compile"
readme = "README.md"
license = "MIT"
authors = [{ name = "ATDev" }]
requires-python = ">=3.10"
keywords = ["mcp", "unreal", "unreal-engine", "ue5", "claude", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/ATDev-Inc/uemcp"
Documentation = "https://github.com/ATDev-Inc/uemcp/tree/main/docs"
Issues = "https://github.com/ATDev-Inc/uemcp/issues"
Changelog = "https://github.com/ATDev-Inc/uemcp/blob/main/CHANGELOG.md"

[project.scripts]
uemcp = "uemcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uemcp"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
